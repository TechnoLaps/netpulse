name: Build Android APK

# Builds an installable debug APK entirely on GitHub's runners (Android SDK +
# JDK are preinstalled). Uses NO EAS build quota. Download the APK from the
# run's "Artifacts" section and sideload it on your phone.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Prebuild + Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Transparent capture: build the hev-socks5-tunnel engine from source
      # (ndk-build) into the app. Submodules are required.
      - name: Fetch tun2socks engine source (recursive)
        run: |
          set -e
          DEST=modules/vpn-interceptor/android/src/main/jni/hev-socks5-tunnel
          rm -rf "$DEST"
          git clone --recursive --depth 1 \
            https://github.com/heiher/hev-socks5-tunnel "$DEST"
          echo "tun2socks engine commit: $(git -C "$DEST" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships a full Android SDK (ANDROID_HOME set, licenses
      # accepted); Gradle auto-downloads any missing platform/build-tools.
      # No setup-android step is needed — the obsolete `tools` package it
      # installs by default no longer exists and fails the build.

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Build native code for arm64-v8a only. Linking all four ABIs exhausts the
      # runner's RAM (ld.lld gets OOM-killed). arm64-v8a covers essentially every
      # real device; this also cuts build time roughly 4x. (Last value wins in a
      # Java .properties file, so appending overrides prebuild's default.)
      - name: Limit native build to arm64-v8a
        run: printf '\nreactNativeArchitectures=arm64-v8a\n' >> android/gradle.properties

      - name: Build debug APK
        working-directory: android
        env:
          NETPULSE_WITH_TUN2SOCKS: '1'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify engine .so is packaged
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q "libhev-socks5-tunnel.so" \
            || (echo "::error::tun2socks engine missing from APK" && exit 1)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netpulse-inspector-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
