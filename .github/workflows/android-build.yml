name: Build Android APK

# Builds an installable debug APK entirely on GitHub's runners (Android SDK +
# JDK are preinstalled). Uses NO EAS build quota. Download the APK from the
# run's "Artifacts" section and sideload it on your phone.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Prebuild + Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships a full Android SDK (ANDROID_HOME set, licenses
      # accepted); Gradle auto-downloads any missing platform/build-tools.
      # No setup-android step is needed — the obsolete `tools` package it
      # installs by default no longer exists and fails the build.

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netpulse-inspector-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
