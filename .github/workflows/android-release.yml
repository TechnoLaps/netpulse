name: Build Android Release APK

# Produces a SIGNED release APK on GitHub's runners (no EAS quota).
#
# Signing key:
#   - If the repo secrets ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD /
#     ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD are set, that stable key is used.
#   - Otherwise a throwaway key is generated for this run so you still get an
#     installable signed APK (fine for testing; you cannot ship Play updates
#     across different throwaway keys).
#
# Trigger: manually (workflow_dispatch) or by pushing a tag like v1.0.0.

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

jobs:
  release:
    name: Prebuild + Gradle assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Limit native build to arm64-v8a
        run: printf '\nreactNativeArchitectures=arm64-v8a\n' >> android/gradle.properties

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          KS="$GITHUB_WORKSPACE/android/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "NETPULSE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "NETPULSE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "NETPULSE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using provided release keystore." >> "$GITHUB_STEP_SUMMARY"
          else
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$KS" -alias netpulse \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" \
              -dname "CN=NetPulse Inspector, O=NetPulse, C=US"
            echo "NETPULSE_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "NETPULSE_KEY_ALIAS=netpulse" >> "$GITHUB_ENV"
            echo "NETPULSE_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — signed with an EPHEMERAL throwaway key."
            echo "Signed with an EPHEMERAL throwaway key (set repo secrets for a stable key)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "NETPULSE_STORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: netpulse-inspector-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
