apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.vpninterceptor'
version = '1.0.0'

// Wire up the Expo Modules API (puts expo.modules.kotlin.* on the classpath,
// configures Kotlin, and provides useCoreDependencies / SDK version helpers).
def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.vpninterceptor"

  defaultConfig {
    minSdkVersion 24
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
}
