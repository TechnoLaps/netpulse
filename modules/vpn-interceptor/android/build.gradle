apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.vpninterceptor'
version = '1.0.0'

// Wire up the Expo Modules API (puts expo.modules.kotlin.* on the classpath,
// configures Kotlin, and provides useCoreDependencies / SDK version helpers).
def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

// Build the native tun2socks engine (hev-socks5-tunnel) from source only when
// explicitly requested, so the default proxy-capture APK pipeline is unaffected.
// The CI "tun2socks" workflow sets NETPULSE_WITH_TUN2SOCKS=1 after a recursive
// clone of the engine into src/main/jni/hev-socks5-tunnel.
def withTun2socks = System.getenv("NETPULSE_WITH_TUN2SOCKS") == "1"

android {
  namespace "expo.modules.vpninterceptor"

  defaultConfig {
    minSdkVersion 24
    consumerProguardFiles "consumer-rules.pro"
    if (withTun2socks) {
      externalNativeBuild {
        ndkBuild {
          abiFilters "arm64-v8a"
        }
      }
    }
  }

  if (withTun2socks) {
    ndkVersion "27.1.12297006"
    externalNativeBuild {
      ndkBuild {
        path "src/main/jni/hev-socks5-tunnel/Android.mk"
      }
    }
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
  // CA + per-host leaf certificate generation for the TLS MITM proxy.
  implementation "org.bouncycastle:bcprov-jdk18on:1.78.1"
  implementation "org.bouncycastle:bcpkix-jdk18on:1.78.1"
}
